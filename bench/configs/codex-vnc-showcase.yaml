# Live disposable-computer campaign. The selected VNC target is supplied only
# to `pikvm-agent lab up --vnc` at runtime and never belongs in this file.
providers:
  codex-spark:
    kind: "codex_app_server"
    model: "gpt-5.3-codex-spark"
    reasoning_effort: "low"
    service_tier: "priority"
    timeout_s: 90
    failure_cooldown_s: 0
    billing:
      mode: "subscription"
  codex-fast:
    kind: "codex_app_server"
    model: "gpt-5.6-terra"
    reasoning_effort: "low"
    service_tier: "priority"
    timeout_s: 90
    failure_cooldown_s: 0
    billing:
      mode: "subscription"

routes:
  reasoner: ["codex-spark", "codex-fast"]
  controller: ["codex-spark", "codex-fast"]
  verifier: ["codex-spark", "codex-fast"]

model_budget:
  max_provider_attempts_per_run: 500

max_actions_per_advance: 4
max_autonomous_resumes: 64
max_actions_per_burst: 8
max_total_actions: 100
max_ungrounded_navigation_replans: 3
