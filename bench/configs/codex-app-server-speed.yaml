# Target-free provider benchmark. This configuration never names or connects
# to a computer; provider-conformance supplies deterministic synthetic pixels.
provider_conformance_path: "../results/codex-app-server-speed.json"

providers:
  luna-low:
    kind: "codex_app_server"
    model: "gpt-5.6-luna"
    reasoning_effort: "low"
    service_tier: "priority"
    timeout_s: 90
    failure_cooldown_s: 0
    billing:
      mode: "subscription"

  luna-medium:
    kind: "codex_app_server"
    model: "gpt-5.6-luna"
    reasoning_effort: "medium"
    service_tier: "priority"
    timeout_s: 90
    failure_cooldown_s: 0
    billing:
      mode: "subscription"

  terra-low:
    kind: "codex_app_server"
    model: "gpt-5.6-terra"
    reasoning_effort: "low"
    service_tier: "priority"
    timeout_s: 90
    failure_cooldown_s: 0
    billing:
      mode: "subscription"

  sol-low:
    kind: "codex_app_server"
    model: "gpt-5.6-sol"
    reasoning_effort: "low"
    service_tier: "priority"
    timeout_s: 90
    failure_cooldown_s: 0
    billing:
      mode: "subscription"

routes:
  reasoner: ["luna-low", "terra-low", "sol-low"]
  controller: ["luna-low", "terra-low", "sol-low"]
  verifier: ["luna-low", "terra-low", "sol-low"]
