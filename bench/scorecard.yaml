      wall: {path: "post_fix_full_run.wall_ms", format: "seconds_from_ms", digits: 2}
    cases: "{trials} trials"
    result: "{prose_chars} prose + {code_chars} code characters exact; overall {status}"
    latency: "See per-trial JSON"
    wall: "{wall}"
    status: "Failing diagnostic"

