    cases: "{contracts} contracts"
    result: "{passed}/{contracts}; {states} durable states; daemon bridge exposed: {bridge}"
    latency: "—"
    wall: "—"
    status: "Passing target-free transaction contract; physical bridge gated"

  - suite: "Windows VNC physical-loop diagnostic"
    route: "Deterministic MCP trials; no model"
