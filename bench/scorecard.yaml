      sessions_halted: {path: "live_trial.sessions_halted", format: "integer"}
      elapsed: {path: "live_trial.cli_elapsed_s", format: "number", digits: 2}
    cases: "{contracts} contracts + 1 live stop"
    result: "All contracts passed; {sessions_halted}/1 session halted"
    latency: "{elapsed}s end-to-end"
    wall: "{elapsed}s"
    status: "Passing local safety contract"

  - suite: "HID payload-shape gate"
