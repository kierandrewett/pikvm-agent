schema_version: 1
as_of: "2026-07-27"
rows:
  - suite: "Independent emergency stop"
    route: "Explicit CLI → isolated daemon"
    source: "results/2026-07-25/safety/emergency-stop-audit.json"
    fields:
      contracts: {path: "contracts", format: "count"}
      sessions_halted: {path: "live_trial.sessions_halted", format: "integer"}
      elapsed: {path: "live_trial.cli_elapsed_s", format: "number", digits: 2}
    cases: "{contracts} contracts + 1 live stop"
    result: "All contracts passed; {sessions_halted}/1 session halted"
    latency: "{elapsed}s end-to-end"
    wall: "{elapsed}s"
    status: "Passing local safety contract"

  - suite: "HID payload-shape gate"
    route: "Raw burst + MCP preflight"
    source: "results/2026-07-25/safety/hid-payload-shape-gate-2026-07-26.json"
    fields:
      total: {path: "counts.total", format: "integer"}
      passed: {path: "counts.passed", format: "integer"}
      rejected: {path: "counts.expected_reject", format: "integer"}
      allowed: {path: "counts.expected_allow", format: "integer"}
      tests: {path: "counts.test_nodes", format: "integer"}
    cases: "{total} payloads / {tests} test nodes"
    result: "{passed}/{total}; {rejected} unsafe refused; {allowed} ordinary allowed"
    latency: "Pre-HID"
    wall: "—"
    status: "Passing local syntax gate; explicit transfer pending"

  - suite: "Read-only media builder"
    route: "Target-free exact-byte ISO"
    source: "results/2026-07-25/safety/msd-media-builder-2026-07-26.json"
    fields:
      contracts: {path: "contracts.total", format: "integer"}
      passed: {path: "contracts.passed", format: "integer"}
      files: {path: "verified.source_files_extracted_exactly", format: "integer"}
      unsafe_names: {path: "verified.unsafe_or_ambiguous_names_refused", format: "integer"}
      max_bytes: {path: "resource_envelope.max_total_bytes", format: "integer"}
    cases: "{contracts} contracts"
    result: "{passed}/{contracts}; {files}/2 files exact; {unsafe_names} unsafe names refused"
    latency: "—"
    wall: "—"
    status: "Passing target-free builder; attach transaction pending"

  - suite: "Virtual-media transaction"
    route: "Target-free approval/rollback state machine"
    source: "results/2026-07-25/safety/virtual-media-transaction-2026-07-26.json"
