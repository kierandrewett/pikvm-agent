      tests: {path: "counts.test_nodes", format: "integer"}
    cases: "{total} payloads / {tests} test nodes"
    result: "{passed}/{total}; {rejected} unsafe refused; {allowed} ordinary allowed"
    latency: "Pre-HID"
    wall: "—"
    status: "Passing local syntax gate; explicit transfer pending"

