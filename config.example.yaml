# PiKVM Agent configuration. Copy to config.yaml (or point $PIKVM_AGENT_CONFIG
# at it). Secrets are NOT stored here — only the names of the env vars to read.

daemon:
  listen: "127.0.0.1:47615"
  session_dir: "~/.local/share/pikvm-agent/sessions"
  sqlite_path: "~/.local/share/pikvm-agent/state.sqlite3"

pikvm:
  base_url: "https://pikvm.local"
  verify_tls: false
  # Visible in every frame, action result, and approval. Set PIKVM_MACHINE_ID
  # to your own stable opaque id; only its hash leaves the daemon.
  machine_alias: "Lab workstation"
  machine_id_env: "PIKVM_MACHINE_ID"
  desktop_layer: "Physical console"
  username_env: "PIKVM_USER"
  password_env: "PIKVM_PASSWORD"
  token_env: "PIKVM_TOKEN" # alternative: an auth_token cookie value
  layout: "us" # us | uk — refined live from the Pi's configured keymap

# Optional local UI-grounding server. Disabled by default; the runtime falls
# back to OCR-only element evidence when this is off or unreachable.
omniparser:
  enabled: false
  mode: "managed_child_process"
  base_url: "http://127.0.0.1:47625"
  health_url: "http://127.0.0.1:47625/probe"
  timeout_s: 20
  command:
    - "/home/kieran/.conda/envs/omni/bin/python"
    - "-m"
    - "omniparserserver"
  cwd: "/home/kieran/dev/OmniParser/omnitool/omniparserserver"

ocr:
  # "tesseract" = local box-capable OCR using the published structured
  # ensemble profile (default). "pikvm" = built-in text-only OCR over the live
  # snapshot. "paddleocr" = local PaddleOCR (needs the [vision] extra).
  # "hybrid" keeps fast Tesseract for ordinary screens and adds independent
  # PaddleOCR evidence only for precise known-intent read-back.
  provider: "tesseract"
  lang: "en"
  device: "cpu" # or gpu (paddleocr only)
  psm: 6
  upscale: 2.0
  ensemble: true
  syntax_aware_selection: true
  hybrid_secondary_timeout_s: 5.0
  # Optional fail-closed fallback for tiny exact fields. The model sees the
  # screen and target region but never the intended text; two blind reads must
  # agree before the result is exposed to the typing verifier.
  blind_model_provider: "none" # or "codex_app_server"
  blind_model: null
  blind_model_executable: "codex"
  blind_model_reasoning_effort: "low"
  blind_model_service_tier: null
  blind_model_timeout_s: 30.0
  blind_model_min_confidence: 0.97
  blind_model_samples: 3
  disable_doc_orientation: true
  disable_doc_unwarping: true
  disable_textline_orientation: true

operator:
  # "fake" = deterministic stub (no network). Set to "openrouter" once a key is
  # present in the environment named by api_key_env.
  provider: "fake"
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"
  routing:
    enabled: true
    reasoner_lane: "hard"
    controller_lane: "cheap"
    fallback_lane: "default"
    refresh_every_steps: 6
  lanes:
    cheap:
      model: "qwen/qwen3-vl-8b-instruct"
    default:
      model: "qwen/qwen3-vl-32b-instruct"
    hard:
      model: "qwen/qwen3-vl-235b-a22b-thinking"

policy:
  default_profile: "read_only_diagnostics"
  require_human_for:
    - communication_send
    - credential_entry
    - sensitive_data_transmit
    - account_or_permission_change
    - terminal_mutating
    - sudo
    - delete
    - local_file_edit
    - file_external_upload
    - software_installation
    - system_setting_change
    - power_or_firmware
    - disk_or_partition
    - financial_or_purchase
    - legal_or_consent
    - unknown

watchers:
  interval_ms: 350
  stable_frame_count: 2
  global_change_threshold: 0.08
  fp_move: 0.04
  fp_settle: 0.015
  fp_meaningful: 0.05
